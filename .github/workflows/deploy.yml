# ZODIAC ASCENSION — GitHub Pages deploy
# Compila con la base correcta para https://salvadortirella.github.io/AstroCrush/
# y publica dist/ vía GitHub Pages (Source: GitHub Actions).
#
# IMPORTANTE: en el repo -> Settings -> Pages -> Source debe decir "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (ci with install fallback)
        run: npm ci || npm install

      # --base fija las URLs de /assets/... al subdirectorio /AstroCrush/
      - name: Build
        run: npx vite build --base=/AstroCrush/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
